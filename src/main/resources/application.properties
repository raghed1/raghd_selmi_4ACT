spring.application.name=raghd_selmi_4ACT

# Database connection
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/autoloc_db_v2?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Logs
logging.level.org.hibernate.SQL=DEBUG

# Server configuration
server.port=8090
server.servlet.context-path=/autoloc